spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/seatlock
    username: seatlock
    password: seatlock
  data:
    redis:
      # short, so a dead Redis costs a request about a second before the limiter and cache fail open
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # commit each offset only after its record is settled, skipped or given up on
      ack-mode: record

seatlock:
  auth:
    # jwt-secret has no default: set SEATLOCK_AUTH_JWT_SECRET (at least 32 bytes, used as-is as the HS256 key)
    token-ttl: PT1H
  rate-limit:
    enabled: true
  seat-cache:
    enabled: true
    ttl: PT1S
  hold-duration: PT5M
  expiry:
    interval: PT5S
    enabled: true
  outbox:
    interval: PT0.5S
    enabled: true
  settlement:
    enabled: true
    retry-backoff: PT1S
    max-retries: 3
  webhooks:
    enabled: true
    interval: PT1S
    batch-size: 20
    # must exceed batch-size x (connect + read timeout) = 20 x 7 s, or claims expire before they are sent
    lease: PT3M
    max-attempts: 6
    base-backoff: PT10S
    allow-http: false
    allow-private-addresses: false
